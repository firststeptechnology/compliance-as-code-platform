name: Spelling Check

on:
  push:
    paths:
      - "**.md"
  pull_request:
    paths:
      - "**.md"

jobs:
  spelling:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check spelling
        uses: rojopolis/spellcheck-github-actions@0.50.0
        with:
          config_path: .spellcheck.yml
