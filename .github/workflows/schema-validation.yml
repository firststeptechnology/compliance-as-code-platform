name: Schema Validation

on:
  push:
    paths:
      - "docs/schemas/**"
      - "examples/**"
  pull_request:
    paths:
      - "docs/schemas/**"
      - "examples/**"

jobs:
  validate-schemas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify schema files exist
        run: |
          test -f docs/schemas/compliance-rule.schema.json
          test -f docs/schemas/framework-metadata.schema.json
          test -f docs/schemas/evidence-record.schema.json

      - name: Verify example files exist
        run: |
          test -f examples/compliance-rule-example.json
          test -f examples/framework-metadata-example.json
          test -f examples/evidence-record-example.json

      - name: Validate JSON syntax
        run: |
          find docs/schemas examples -name "*.json" -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            python -m json.tool "$file" > /dev/null
          done
